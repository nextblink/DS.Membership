  <circle cx="27" cy="6" r="4" fill="url(#mg)"/>

  <!-- Right figure sweep -->
  <path d="M 33 44 C 33 41 32 37 30 32 C 27 26 24 23 24 18 C 24 12 28 9 33 14 C 39 20 44 30 44 44"
        fill="none" stroke="url(#mg)" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="34" cy="10" r="3.5" fill="url(#mg)"/>

  <!-- Arrow -->
  <path d="M 28 40 L 44 8" fill="none" stroke="url(#ag)" stroke-width="3" stroke-linecap="round"/>
